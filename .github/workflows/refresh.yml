name: Refresh tracker

# Weekly on Monday morning (UTC). For a monthly refresh instead, replace the
# cron with "17 6 1 * *" — first day of the month.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      skip_sponsors:
        description: "Skip the sponsor sweep (faster, no new review candidates)"
        type: boolean
        default: false

permissions:
  contents: write # commit the new snapshot
  issues: write # open the manual-review issue
  pages: write # publish the site
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No dependencies: the scripts are standard library only.
      - name: Self-test
        run: python scripts/selftest.py

      - name: Refresh from ClinicalTrials.gov
        run: |
          python scripts/refresh.py ${{ inputs.skip_sponsors && '--skip-sponsors' || '' }}

      - name: Rebuild the dashboard payload
        run: python scripts/build.py

      - name: Write the job summary
        run: python scripts/report.py >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the snapshot
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing changed."
          else
            git commit -m "Refresh $(date -u +%Y-%m-%d) from ClinicalTrials.gov"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Possible new AI-designed drugs are never added automatically: they are
      # raised as an issue for a human to check against criteria.md.
      - name: Open a manual-review issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/report.py --new-only > /tmp/review.md
          if [ -s /tmp/review.md ]; then
            gh issue create \
              --title "Review: possible new AI-designed drugs ($(date -u +%Y-%m-%d))" \
              --body-file /tmp/review.md \
              --label "review" || gh issue create \
              --title "Review: possible new AI-designed drugs ($(date -u +%Y-%m-%d))" \
              --body-file /tmp/review.md
          else
            echo "No new candidates this refresh."
          fi

      # Pages publishing is opt-in: set the repository variable
      # PUBLISH_PAGES=true once Pages is configured (Settings -> Pages ->
      # Source: GitHub Actions). Until then the refresh still runs and commits.
      - uses: actions/configure-pages@v5
        if: vars.PUBLISH_PAGES == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: vars.PUBLISH_PAGES == 'true'
        with:
          path: site

  deploy:
    needs: refresh
    if: vars.PUBLISH_PAGES == 'true'
    runs-on: ubuntu-latest
    # Shared with publish.yml so two deploys never race.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # Same guard as publish.yml: confirm the page is really serving, and
      # never let the manual-review queue reach it.
      - name: Smoke-test the published page
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          payload="${PAGE_URL%/}/data/dashboard.json"
          for attempt in 1 2 3 4 5; do
            code=$(curl -fsS -o /tmp/live.json -w '%{http_code}' "$payload") && break
            echo "attempt $attempt: not serving yet (${code:-no response}), waiting for the CDN"
            sleep 10
          done
          test -s /tmp/live.json || { echo "::error::$payload never returned a body"; exit 1; }
          python3 - <<'PY'
          import json, sys
          d = json.load(open("/tmp/live.json"))
          if "review_queue" in d:
              sys.exit("::error::the published payload carries the manual-review queue")
          print(f"live: {len(d['drugs'])} drugs, refreshed {d['meta']['last_refresh']}")
          PY

  # A silent refresh or deploy failure means stale public data, so say so.
  notify:
    needs: [refresh, deploy]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update a refresh-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create refresh-failure --color B60205 \
            --description "A scheduled refresh or its deploy failed" 2>/dev/null || true
          body="The Refresh tracker workflow failed, so the tracker data or the live page may be stale. Run: $RUN_URL"
          existing=$(gh issue list --label refresh-failure --state open --limit 1 \
            --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Refresh failed $(date -u +%Y-%m-%d)" \
              --body "$body" --label refresh-failure
          fi
