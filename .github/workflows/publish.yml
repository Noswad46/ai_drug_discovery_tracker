name: Publish site

# Deploys site/ to GitHub Pages when the page itself changes. The scheduled
# refresh deploys its own run (pushes made with GITHUB_TOKEN do not trigger
# workflows), so the two share a concurrency group instead of racing.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
