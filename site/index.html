<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI-designed drugs in clinical development</title>
    <meta
      name="description"
      content="A tracker for drugs whose discovery used AI or machine learning materially, refreshed against the ClinicalTrials.gov v2 API and stored as dated snapshots."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="assets/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Crect x='7' y='17' width='4' height='8' rx='1' fill='%23fff'/%3E%3Crect x='14' y='12' width='4' height='13' rx='1' fill='%23fff'/%3E%3Crect x='21' y='7' width='4' height='18' rx='1' fill='%23fff'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <!-- Both the rail and its toggle stay hidden until app.js fills them in,
         so a JavaScript-off page shows no empty chrome. -->
    <nav class="toc" id="toc" aria-label="Page contents" hidden>
      <p class="toc-head">Contents</p>
      <ol id="toc-list"></ol>
    </nav>
    <button class="toc-toggle" id="toc-toggle" type="button" aria-controls="toc" aria-expanded="false" hidden>
      Contents
    </button>
    <div class="toc-scrim" id="toc-scrim"></div>
    <main class="wrap" id="app">
      <noscript>
        <h1>AI-designed drugs in clinical development</h1>
        <p>
          This dashboard renders from a JSON payload in the browser. With JavaScript off, the same
          data is available as
          <a href="data/dashboard.json">data/dashboard.json</a>, and the dated snapshots it is built
          from live in <code>data/snapshots/</code> in the repository.
        </p>
      </noscript>
      <p class="empty">Loading…</p>
    </main>
    <script src="data/dashboard.js"></script>
    <script src="assets/app.js"></script>
  </body>
</html>
